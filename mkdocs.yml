site_name: SUCC - SurfsUp Character Controller
site_description: Multiplayer-focused, inheritable, state-based character controller for Godot 4.
site_url: https://bearlikelion.github.io/SUCC/
repo_url: https://github.com/bearlikelion/SUCC
edit_uri: edit/main/docs/

theme:
  name: material
  font:
	text: Inter
	code: JetBrains Mono
  features:
	- navigation.sections
	- navigation.expand
	- navigation.top
	- navigation.tracking
	- toc.follow
	- search.suggest
	- search.highlight
	- content.code.copy
	- content.code.annotate
  palette:
	- scheme: gruvbox-dark
	  toggle:
		icon: material/weather-sunny
		name: Light mode
	- scheme: gruvbox-light
	  toggle:
		icon: material/weather-night
		name: Dark mode
  icon:
	repo: fontawesome/brands/github

extra_css:
  - stylesheets/gruvbox.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
	  anchor_linenums: true
	  line_spans: __span
	  pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
	  alternate_style: true
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
	  permalink: true

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - How-to Guides:
	- Use a movement preset: how-to/use-a-preset.md
	- Extend SUCC for your game: how-to/extend-succ.md
	- Tune your own movement: how-to/tune-movement.md
	- Add multiplayer: how-to/add-multiplayer.md
  - Explanation:
	- How the movement works: explanation/movement.md
	- How accurate are the presets?: explanation/engine-accuracy.md
	- The demo gym: explanation/demo-level.md
  - Reference:
	- Preset values: reference/presets.md
	- SUCC: reference/succ.md
	- SUCCConfig: reference/succ_config.md
	- SUCCCamera: reference/succ_camera.md
	- SUCCPawn: reference/succ_pawn.md
  - Games Built with SUCC: games.md
  - Acknowledgements: acknowledgements.md
